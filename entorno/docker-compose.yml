# =============================================================================
#  ENTORNO DOCENTE — DAW  |  Curso 2026-2027
#
#  Orden de aprendizaje:
#    1) Vanilla JS + API + MySQL
#    2) Angular 22 (módulo cliente)
#    3) React 19 + Node (full-stack)
#
#  Arranque típico:
#    docker compose up -d
#      → MySQL, phpMyAdmin, API, vanilla, Angular, React
#
#  Entrar a un contenedor (siempre con bash, para los aliases):
#    docker compose exec angular22 bash
#    docker compose exec react19 bash
#
#  Puertos:
#    4300  Vanilla JS
#    4222  Angular (desarrollo)
#    4319  React (desarrollo)
#    4200  Angular build (perfil produccion)
#    3000  API Node
#    3306  MySQL
#    8081  phpMyAdmin
# =============================================================================

services:

  # ── Angular 22 ──────────────────────────────────────────────────────────────
  angular22:
    build: ./angular22
    working_dir: /usr/src/app
    volumes:
      - ./angular22:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "4222:4200"
    tty: true
    stdin_open: true
    environment:
      - CHOKIDAR_USEPOLLING=true

  # ── React 19 ────────────────────────────────────────────────────────────────
  react19:
    build: ./react19
    working_dir: /usr/src/app
    volumes:
      - ./react19:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "4319:5173"
    tty: true
    stdin_open: true
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

  # ── API Node.js ─────────────────────────────────────────────────────────────
  nodejs-api:
    build: ./nodejs-api
    working_dir: /usr/src/app
    volumes:
      - ./nodejs-api:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      DB_HOST: mysql-db
      DB_USER: root
      DB_PASS: dejame

  # ── MySQL 8 ─────────────────────────────────────────────────────────────────
  mysql-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dejame
    volumes:
      - mysql_data:/var/lib/mysql
      # Solo debe haber UN .sql aquí. Cualquier otro (p.ej. *_BACKUP.sql)
      # también se ejecuta al primer arranque y MySQL puede fallar.
      - ./db:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdejame"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── phpMyAdmin (formulario de login: root / dejame) ─────────────────────────
  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: mysql-db
    ports:
      - "8081:80"
    depends_on:
      mysql-db:
        condition: service_healthy

  # ── Angular build producción (opcional) ─────────────────────────────────────
  angular-app:
    image: nginx:alpine
    volumes:
      - ./angular-app/dist:/usr/share/nginx/html:ro
      - ./angular-app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "4200:80"
    profiles:
      - produccion

  # ── Vanilla JS / ejercicios ─────────────────────────────────────────────────
  vanilla-app:
    image: nginx:alpine
    volumes:
      - ./vanilla-app/sites:/usr/share/nginx/html:ro
      - ./vanilla-app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "4300:80"

volumes:
  mysql_data:

networks:
  default:
    name: fp-devsetup
