<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Registro de usuario con cookies" />
    <title>JavaScript ES6 – Usuarios</title>
    <link rel="icon" type="image/x-icon" href="./img/favicon.ico" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./ejercicios/css/styles.css" />
    <script src="./js/indexedDB/indexedDB.js" defer></script>
    <script src="./js/indexedDB/setIndexedDB.js" defer></script>
    <script src="./js/indexedDB/getIndexedDB.js" defer></script>
    <script src="./js/sesion.js" defer></script>
    <script src="./js/auth.js" defer></script>
    <script src="./js/menu.js" defer></script>
    <script src="./js/usuariosAPI/mostrar.js" defer></script>
    <script src="./js/usuariosAPI/cargarFormulario.js" defer></script>
    <script src="./js/usuariosAPI/llamarAPI.js" defer></script>
    <script src="./js/usuariosAPI/datosAPI.js" defer></script>
    <script src="./js/usuariosAPI/script.js" defer></script>
</head>

<body>
    <header class="header">
        <div class="header-content">
            <h3>Ejemplos – FUNDAMENTOS DE JS (ES6)</h3>
            <h4>Desarrollo WEB en entorno cliente</h4>
            <h2>CRUD de usuarios</h2>
        </div>
        <div class="header-profile">
            <img src="./img/user.png" alt="Foto de perfil">
        </div>
    </header>

    <nav>
        <ul class="navbar">
            <li><a href="https://www.w3schools.com/js/default.asp">w3schools</a></li>
            <li><a href="https://es.javascript.info/js">javascript.info</a></li>
            <li><a href="https://developer.mozilla.org/es/docs/Web/JavaScript">MDN</a></li>
        </ul>
    </nav>

    <main>
        <div class="container">
            <div class="card">
                <div class="cardTitle">Formulario de Usuario</div>
                <div class="cardBody">

                    <!-- AÑADIR: para cargar un usuario aleatorio desde la API -->
                    <div class="acciones-usuarios" style="margin-bottom: .75rem;">
                        <input id="cargarAPI" class="boton" data-fn="⏬" type="button"
                            value="⏬ Cargar usuario aleatorio">
                    </div>

                    <form id="formUsuario">
                        <label for="nombre">Nombre real:</label><br>
                        <input type="text" id="nombre" required><br><br>

                        <label for="usuario">Usuario:</label><br>
                        <input type="text" id="usuario" required><br><br>

                        <label for="password">Contraseña:</label><br>
                        <input type="password" id="password" required><br><br>

                        <!-- AÑADIR: Campo de Ciudad (para enlazar con el clima después) -->
                        <label for="ciudad">Ciudad:</label><br>
                        <input type="text" id="ciudad" placeholder="p. ej., Málaga"><br><br>

                        <!-- AÑADIR: Campo oculto para guardar la URL de imagen cuando viene de la API -->
                        <input type="hidden" id="imagenURL">

                        <label for="imagen">Imagen de perfil:</label><br>
                        <input type="file" id="imagen" accept="image/*"><br><br>

                        <button type="submit">Guardar</button>
                    </form>
                    <p id="mensaje"></p>
                </div>
            </div>

            <div class="card">
                <div class="cardTitle">Listado de Usuarios</div>
                <div class="cardBody">
                    <table id="tablaUsuarios">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Usuario</th>
                                <th>Ciudad</th> <!-- AÑADIR -->
                                <th>Imagen</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Se insertan dinámicamente -->
                        </tbody>
                    </table>
                </div>
                <div class="cardFooter">
                    <a href="./index.html">← Volver a la página principal</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        © José García ☺
    </footer>
</body>

</html>
