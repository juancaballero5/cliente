<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 02 – Cambios de Base</title>
    <link rel="icon" href="../../../img/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../../../css/styles.css" />
    <link rel="stylesheet" href="../../css/styles.css" />
    <script src="../../../js/indexedDB/indexedDB.js" defer></script>
    <script src="../../../js/indexedDB/getIndexedDB.js" defer></script>
    <script src="../../../js/sesion.js" defer></script>
    <script src="../../../js/auth.js" defer></script>
    <script src="../../../js/menu.js" defer></script>
    <script defer src="./js/script.js"></script>
</head>

<body>
    <header class="header">
        <div class="header-content">
            <h3>Ejemplos – FUNDAMENTOS DE JS (ES6)</h3>
            <h4>Desarrollo WEB en entorno cliente</h4>
            <h2>Ejercicio 02 – Cambios de Base</h2>
        </div>
        <div class="header-profile">
            <img src="../../../img/user.png" alt="Foto de perfil">
        </div>
    </header>

    <nav>
        <ul class="navbar">
            <li><a href="https://www.w3schools.com/js/default.asp">w3schools</a></li>
            <li><a href="https://es.javascript.info/js">javascript.info</a></li>
            <li><a href="https://developer.mozilla.org/es/docs/Web/JavaScript">MDN</a></li>

        </ul>
    </nav>

    <main>
        <div class="container">
            <div class="card">
                <div class="cardTitle">Cambios de base</div>
                <div class="cardBody">
                    <fieldset>
                        <legend>Conversiones de decimal a bases:</legend>
                        <label for="num1">Número:</label>
                        <input id="num1" type="text" name="num1" placeholder="Introduce un número..." />&nbsp;&nbsp;

                        <input id="toBinario" type="button" value="/2">&nbsp;&nbsp;
                        <input id="toOctal" type="button" value="/8">&nbsp;&nbsp;
                        <input id="toHexa" type="button" value="/16">
                    </fieldset>
                    <p id="bases"></p>
                    </br>
                    <input id="copiar" type="button" value="Copiar">
                    </br></br>
                    <fieldset>
                        <legend>Conversiones de bases a decimal:</legend>
                        <label for="num2">Número:</label>
                        <input id="num2" type="text" name="num2" placeholder="Añade 0b_, 0o_ ó 0x_..." />&nbsp;&nbsp;

                        <input id="fromBinario" type="button" value="/2">&nbsp;&nbsp;
                        <input id="fromOctal" type="button" value="/8">&nbsp;&nbsp;
                        <input id="fromHexa" type="button" value="/16">
                    </fieldset>
                    <p id="decimal"></p>
                    </br>
                    <p><span id="texto"></span><strong id="resultado"></strong></p>
                </div>
                <div class="cardFooter"><a href="../../../index.html">&gt;&gt; Página principal</a></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        © José García ☺
    </footer>
</body>

</html>
